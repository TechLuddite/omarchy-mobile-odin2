# Host-side template: merge into ~/.ssh/config after installing the private key
# as ~/.ssh/odin2-omarchy and pinning trusted host keys in ~/.ssh/odin2-known_hosts.
# Neither key material nor the host's live configuration belongs in this repo.
Host odin2-root
    User root

Host odin2 odin2-root
    HostName odin2portal.local
    User techluddite
    AddressFamily inet
    IdentityFile ~/.ssh/odin2-omarchy
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    UserKnownHostsFile ~/.ssh/odin2-known_hosts
    ConnectTimeout 10
    ServerAliveInterval 15
    ServerAliveCountMax 3
