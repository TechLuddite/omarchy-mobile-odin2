# Candidate WCD digital microphones for the matching Android QRD board route.
# Luke Johnson's DMIC input widgets (Pocknix) are already in the ROCKNIX kernel.
# Requires the DMIC2/3 + MIC BIAS3 + TX SWR_INPUT6/7 DT routes. Not yet accepted.
# This file is separate from the currently deployed headset-based probe.
SectionDevice."Mic" {
    Comment "Internal microphone (WCD candidate)"
    EnableSequence [
        cset "name='DMIC2 Switch' 1"
        cset "name='DMIC3 Switch' 1"
        cset "name='DMIC2_MIXER Switch' 1"
        cset "name='DMIC3_MIXER Switch' 1"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC6"
        cset "name='TX SMIC MUX1' SWR_MIC7"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
        cset "name='TX_DEC0 Volume' 100"
        cset "name='TX_DEC1 Volume' 100"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='DMIC2_MIXER Switch' 0"
        cset "name='DMIC3_MIXER Switch' 0"
        cset "name='DMIC2 Switch' 0"
        cset "name='DMIC3 Switch' 0"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}

# Headset route: Teguh Sobirin and AYNTechnologies/alsa-ucm-conf.
SectionDevice."Headset" {
    Comment "Headset microphone"
    Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
    Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
    Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
    Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},2"
        CaptureMixerElem "ADC2"
        CaptureChannels 2
        JackControl "Mic Jack"
    }
}
